<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="mat">
      <div class="art-wrap" id="art-wrap">
        <div class="art"></div>
        <div class="loading">Loading artwork...</div>
        <div class="artwork-clip"><img class="artwork" id="artwork" alt="Artwork"></div>
      </div>
    </div>
    <div class="timer" id="timer">00:30</div>
    <div class="buttons">
      <button class="btn" id="toggle-btn">Start</button>
      <button class="btn soft" id="reset-btn">Reset</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
