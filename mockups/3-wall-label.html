<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 3: Wall Label</title>
  <style>
    :root {
      --wall: #f1e9d6;
      --paper: #fbf7ec;
      --ink: #3b3226;
      --muted: #8a7d68;
      --line: #d9ccb2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--wall);
      color: var(--ink);
      font-family: "American Typewriter", "Courier New", Courier, monospace;
      line-height: 1.5;
    }
    .intro { text-align: center; padding: 32px 16px 8px; color: var(--muted); font-size: 0.85rem; }
    .intro h1 { margin: 0 0 4px; font-size: 1.1rem; color: var(--ink); letter-spacing: 0.08em; text-transform: uppercase; }

    .view { padding: 40px 16px 56px; border-top: 1px dashed var(--line); }
    .view-label {
      text-align: center; margin: 0 0 24px;
      font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    }

    /* phone: painting on top, label underneath */
    .room { max-width: 460px; margin: 0 auto; }
    .art-wrap { overflow: hidden; }
    .art {
      aspect-ratio: 4 / 5;
      background:
        radial-gradient(circle at 68% 28%, #f0d9a8 0 11%, transparent 12%),
        linear-gradient(165deg, #d2ad86 0%, #a97c64 48%, #647572 100%);
    }
    .blur-heavy { filter: blur(22px); }
    .blur-medium { filter: blur(9px); }
    .loading {
      aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center;
      background: #efe6d2; color: var(--muted); font-size: 0.95rem;
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

    .label {
      margin-top: 18px; padding: 18px 20px;
      background: var(--paper); border: 1px solid var(--line);
      min-height: 190px; /* same size in every view so nothing jumps */
    }
    .timer { margin: 0 0 12px; font-size: 1.25rem; letter-spacing: 0.12em; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      font: inherit; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink); background: #efe6d2;
      border: 0; border-radius: 3px; padding: 8px 14px; cursor: pointer;
    }
    .btn.soft { color: var(--muted); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
    .details { margin-top: 14px; padding-top: 12px; border-top: 1px dotted var(--line); }
    .details p { margin: 0; }
    .details .name { font-style: italic; }
    .details .meta { color: var(--muted); font-size: 0.9rem; }

    /* laptop: painting large on the left, slim label on the right */
    @media (min-width: 900px) {
      .room {
        max-width: 1040px;
        display: grid; grid-template-columns: 2fr 1fr; gap: 32px; align-items: end;
      }
      .art, .loading { aspect-ratio: auto; height: 560px; }
      .label { margin-top: 0; }
    }
  </style>
</head>
<body>
  <div class="intro">
    <h1>Wall Label</h1>
    Mockup 3 of 3 &middot; design only, the buttons do nothing
  </div>

  <section class="view">
    <p class="view-label">View 1 &middot; Before starting</p>
    <div class="room">
      <div class="art-wrap"><div class="art blur-heavy"></div></div>
      <div class="label">
        <p class="timer">25:00</p>
        <div class="buttons">
          <button class="btn">Start</button>
          <button class="btn soft">Reset</button>
        </div>
      </div>
    </div>
  </section>

  <section class="view">
    <p class="view-label">View 2 &middot; Timer running</p>
    <div class="room">
      <div class="art-wrap"><div class="art blur-medium"></div></div>
      <div class="label">
        <p class="timer">14:32</p>
        <div class="buttons">
          <button class="btn">Pause</button>
          <button class="btn soft">Reset</button>
        </div>
      </div>
    </div>
  </section>

  <section class="view">
    <p class="view-label">View 3 &middot; Timer finished</p>
    <div class="room">
      <div class="art-wrap"><div class="art"></div></div>
      <div class="label">
        <p class="timer">00:00</p>
        <div class="buttons">
          <button class="btn">Restart session</button>
        </div>
        <div class="details">
          <p class="name">The Quiet Orchard</p>
          <p class="meta">Marguerite Aldous, 1887</p>
        </div>
      </div>
    </div>
  </section>

  <section class="view">
    <p class="view-label">Extra &middot; Loading artwork</p>
    <div class="room">
      <div class="loading">Loading artwork...</div>
      <div class="label">
        <p class="timer">25:00</p>
        <div class="buttons">
          <button class="btn soft">Start</button>
          <button class="btn soft">Reset</button>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
